# sshd drop-in for the hermes container.
# Included from the main sshd_config via /etc/ssh/sshd_config.d/*.conf.

# Auth: password (default) and public key; never empty passwords.
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no

# The mounted authorized_keys file is owned by the host user, which need not
# match the in-container hermes uid. The container is a single-user security
# boundary, so relax the ownership/permission strictness — otherwise sshd
# silently ignores the key.
StrictModes no

# Log in as the hermes user only — never root.
PermitRootLogin no
AllowUsers hermes

# Pubkeys are mounted in here (one file per user) — outside /opt/data.
AuthorizedKeysFile /etc/ssh/keys/%u

# Let the client carry locale + terminal type through for a usable TUI.
AcceptEnv LANG LC_* TERM COLORTERM
